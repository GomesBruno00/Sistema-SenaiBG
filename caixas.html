<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas</title>
</head>

<style>
    /* estilo*/
    html {border: 1px solid red;
    }
    body{
        border: 1px solid green;
        text-align: center;
    }
    h1{
        border: 1px solid blue;
        padding: 50px;
        margin: 1px;
        background-color: aquamarine;
    }
    span{
        border: 1px solid purple;
        margin: 20px;
        padding:20px;
        border-radius: 10px;
        
    }
    /* classes são identificadas por um ponto (.) */

    .diferente{
        background-color: green

    }
    .negrito{
        font-weight: bold;
    }

    /* ID são identficados por #*/
    #caixinha{
        font-size: 10px;
        background: linear-gradient(to right, red, rgb(255,115,1));
        background: radial-gradient(red)

    }

</style>

<body>
    <h1>Caixas</h1>
    <h1>CAIXAS</h1>
    <span class="diferente">caixa</span><span>caixa</span><span>caixa</span><span>caixa</span><span>caixa</span>
     <span class="diferente negrito">caixa</span>
     <span>caixa</span>
     <span>caixa</span>
     <span>caixa</span>
     <span>caixa</span>
     <span id="caixinha">caixa</span>

</body>

</html>
